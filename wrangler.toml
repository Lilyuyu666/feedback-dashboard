name = "feedback-dashboard"
main = "worker.js"
compatibility_date = "2024-01-01"

[env.production.vars]
ENVIRONMENT = "production"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "feedback_150"
database_id = "598b9835-eba6-4d56-8b3b-19f966fda1e8"

# Optional: KV namespace for caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Optional: R2 bucket for file storage
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "your-bucket-name"
